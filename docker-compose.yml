version: "3.9"

services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag_backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env

  frontend:

    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag_frontend

    command: >
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    depends_on:
      - backend

    volumes:
      - .:/app

    env_file:
      - .env