version: "3.9"

services:

  backend:
    build: .

    container_name: rag-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./storage:/app/storage
      - ./data:/app/data

    restart: unless-stopped


  frontend:

    build: .

    container_name: rag-frontend

    command: >
      streamlit run frontend/app.py
      --server.port 8501
      --server.address 0.0.0.0

    ports:
      - "8501:8501"

    env_file:
      - .env

    depends_on:
      - backend

    volumes:
      - ./storage:/app/storage
      - ./data:/app/data

    restart: unless-stopped